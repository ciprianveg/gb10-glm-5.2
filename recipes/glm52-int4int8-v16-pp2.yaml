# GLM-5.2 Int4-Int8Mix (TP=4 + PP=2 on 8× GB10 / DGX Spark, unpruned QuantTrio)
#
# v16 stack: local-inference-lab/vllm @fathomless-firmament-v16-unified + b12x master
# TP=4 + PP=2 across 8 nodes, DCP=1 (disabled; DCP patches retained for future DCP>1 use).
# MTP k=4 with pipeline-parallel draft token relay (PR #46994 Fixes #2 + #3).
#
# Container: vllm-node-tf5-glm52-v16-pp2:latest
# Model:     QuantTrio/GLM-5.2-Int4-Int8Mix (378GB, 124 safetensor shards)
#
# Patches in this image (patches/v16-final/):
#   01-pr72-1-draft-dcp-config-propagation.patch  (DCP config propagation)
#   03-draft-quant-packed-mapping.patch            (quantized NextN drafts)
#   04-v16-essential.patch                         (SupportsPP + stale topk + embed_tokens)
#   05-pp-mtp-broadcast-and-draft-relay.patch      (Fix #2: broadcast padding, Fix #3: draft relay)
#   06-b12x-stale-topk-buffer.patch                (B12X_MLA_SPARSE stale topk_indices_buffer fix)
#   07-draft-pp-size-fix.patch                     (draft pipeline_parallel_size=1 fix)
#
# PP2 + MTP fixes from PR #46994 (isolated, PP-gated code paths only):
#   Fix #2: PPHandler.broadcast() pads sampled_token_ids to max_sample_len (hang fix)
#   Fix #3: Draft token relay via 3rd NCCL broadcast + scatter into req_states.draft_tokens
#
# B12X_MLA_SPARSE stale-buffer fix (Fix #4 applied to b12x_mla_sparse.py):
#   Store self._indexer = indexer in __init__, read self._indexer.topk_indices_buffer
#   dynamically in forward_mqa. Without this, _maybe_share_lm_head replaces the
#   indexer's buffer after construction, but the impl keeps the stale reference →
#   garbage DSA attention → ~27-33% acceptance instead of ~85%.
#
# Draft pp_size fix:
#   create_draft_parallel_config() copies pipeline_parallel_size from the target,
#   but the draft model only runs on the last PP rank and should have pp_size=1.
#   This is the same class of bug as PR #72 (DCP propagation) but for PP.

recipe_version: "1"
name: GLM-5.2-Int4-Int8-TP4-PP2
description: GLM-5.2 Int4-Int8Mix (unpruned QuantTrio) on 8× GB10, TP=4 + PP=2, MTP k=4
raw_entrypoint: true
shared_weights_nfs: true
cluster_only: true

# v16 stack image with PP2+MTP patches
container: vllm-node-tf5-glm52-v16-pp2:latest

# Model weights — NFS-mounted at /root/models/models14 inside container
model: /root/models/models14/GLM-5.2-Int4-Int8


# Environment — v16 stack
env:
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  LD_PRELOAD: /opt/nccl-2.30.4/lib/libnccl.so.2
  LD_LIBRARY_PATH: /opt/nccl-2.30.4/lib
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"

  # V2 runner + B12X sparse indexer (required for B12X_MLA_SPARSE)
  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  GLM52_BIND_HOST_TRITON: "0"
  VLLM_B12X_MLA_SPEC_EXTEND_AS_DECODE: "1"

  # DCP env vars (kept for future DCP>1; no-ops at DCP=1)
  VLLM_DCP_GLOBAL_TOPK: "1"
  VLLM_DCP_SHARD_DRAFT: "1"

  TORCH_CUDA_ARCH_LIST: "12.1a"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: 8

  VLLM_USE_RAY_V2_EXECUTOR_BACKEND: "1"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"

  # Stability + KV cache gains
  RAY_memory_monitor_refresh_ms: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NVLS_ENABLE: "0"
  NCCL_BUFFSIZE: "8388608"

  TORCH_EXTENSIONS_DIR: /cache/huggingface/torch_extensions
  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/torchinductor-cache
  TRITON_CACHE_DIR: /cache/huggingface/triton-cache
  XDG_CACHE_HOME: /cache/huggingface

  CUTE_DSL_ARCH: "sm_121a"
  NCCL_MAX_NCHANNELS: "8"
  NCCL_MIN_NCHANNELS: "8"

command: |
  vllm serve /root/models/models14/GLM-5.2-Int4-Int8 \
    --served-model-name GLM-5.2-Int4-Int8 \
    --host 0.0.0.0 --port 5001 \
    --trust-remote-code \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --async-scheduling \
    --tensor-parallel-size 4 \
    --pipeline-parallel-size 2 \
    --decode-context-parallel-size 1 \
    --dcp-kv-cache-interleave-size 1 \
    --attention-backend B12X_MLA_SPARSE \
    --hf-overrides '{{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}}' \
    --max-model-len 405000 \
    --max-num-seqs 5 \
    --max-num-batched-tokens 4096 \
    --gpu-memory-utilization 0.615 \
    --kv-cache-dtype fp8_ds_mla \
    --distributed-executor-backend ray \
    --compilation-config '{{"cudagraph_mode":"FULL","max_cudagraph_capture_size":16}}' \
    --default-chat-template-kwargs '{{"reasoning_effort":"high", "clear_thinking": false}}' \
    --speculative-config '{{"method":"mtp","quantization":"compressed-tensors","draft_attention_backend":"B12X_MLA_SPARSE","num_speculative_tokens":4,"draft_tensor_parallel_size":1}}' \
    --seed 42
