# GLM-5.2 Int4-Int8Mix with DSpark speculative decoding (experimental)
#
# Uses the b1rd/GLM-5.2-speculator.dspark-quanttrio-int4-ft draft model,
# finetuned specifically for QuantTrio Int4-Int8Mix target.
#
# WARNING: v18 image does NOT have VLLM_DSPARK_DRAFT_RING support.
# The speculator README says ring-buffer windowed drafting is "required"
# to avoid acceptance depth-collapse. Without it, acceptance will be
# lower (~1.4 vs ~2.1 tokens/step). Still worth testing.
#
# Container: vllm-node-tf5-glm52-v18:latest
# Target:   QuantTrio/GLM-5.2-Int4-Int8Mix (378GB, 124 safetensor shards)
# Draft:    b1rd/GLM-5.2-speculator.dspark-quanttrio-int4-ft/ft32k (reduced vocab)

recipe_version: "1"
name: GLM-5.2-Int4-Int8-DSpark
description: GLM-5.2 Int4-Int8Mix with DSpark speculator (experimental, no ring buffer)
raw_entrypoint: true
shared_weights_nfs: true
cluster_only: true

container: vllm-node-tf5-glm52-v18:latest
model: /root/models/models14/GLM-5.2-Int4-Int8

env:
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  LD_PRELOAD: /opt/libnccl-local-inference.so.2.30.4
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "256"

  VLLM_USE_V2_MODEL_RUNNER: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  GLM52_BIND_HOST_TRITON: "0"

  TORCH_CUDA_ARCH_LIST: "12.1a"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  OMP_NUM_THREADS: 8

  VLLM_USE_RAY_V2_EXECUTOR_BACKEND: "1"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"

  RAY_memory_monitor_refresh_ms: "0"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  NCCL_NVLS_ENABLE: "0"
  NCCL_BUFFSIZE: "16777216"

  TORCH_EXTENSIONS_DIR: /cache/huggingface/torch_extensions
  TORCHINDUCTOR_CACHE_DIR: /cache/huggingface/torchinductor-cache
  TRITON_CACHE_DIR: /cache/huggingface/triton-cache
  XDG_CACHE_HOME: /cache/huggingface

  CUTE_DSL_ARCH: "sm_121a"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"

mods:
  - mods/fix-v18-venv-paths
  - mods/fix-mtp-quant-packed-mapping
  - mods/fix-dsa-block-table-dim
  - mods/fix-fsm-toolcall-v18
  - mods/fix-b12x-cute-cache-key
  - mods/decode-aware-scheduler
  - mods/fix-v16-b12x-stale-topk

command: |
  vllm serve /root/models/models14/GLM-5.2-Int4-Int8 \
    --served-model-name GLM-5.2-Int4-Int8 \
    --host 0.0.0.0 --port 5001 \
    --trust-remote-code \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --async-scheduling \
    --enable-flashinfer-autotune \
    -cc.pass_config.fuse_allreduce_rms=True \
    --tensor-parallel-size 8 \
    --pipeline-parallel-size 1 \
    --decode-context-parallel-size 1 \
    --dcp-kv-cache-interleave-size 1 \
    --attention-backend B12X_MLA_SPARSE \
    --hf-overrides '{{"index_topk_pattern":"FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}}' \
    --max-model-len auto \
    --max-num-seqs 5 \
    --max-num-batched-tokens 4096 \
    --long-prefill-token-threshold 2048 \
    --enable-decode-aware-prefill \
    --decode-prefill-token-budget 256 \
    --idle-prefill-token-budget 16384 \
    --max-long-prefills-per-step 1 \
    --gpu-memory-utilization 0.726 \
    --kv-cache-dtype fp8_ds_mla \
    --distributed-executor-backend ray \
    --compilation-config '{{"cudagraph_mode":"FULL","max_cudagraph_capture_size":16}}' \
    --default-chat-template-kwargs '{{"reasoning_effort":"high", "clear_thinking": false}}' \
    --speculative-config '{{"method":"dspark","model":"/root/models/models11/GLM-5.2-speculator.dspark-quanttrio-int4-ft/ft32k","num_speculative_tokens":3,"attention_backend":"TRITON_ATTN","quantization":"fp8","draft_sample_method":"greedy","draft_tensor_parallel_size":1}}' \
    --seed 42
